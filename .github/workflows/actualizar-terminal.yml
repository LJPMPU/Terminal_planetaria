def generar(destino):
    """Descarga datos y escribe el HTML. Devuelve (con_datos, total, sin_datos)."""
    tickers = [t for _, items in SECCIONES for _, t in items]
    datos = descargar(tickers)

    if not any(datos.values()):
        raise RuntimeError("ningún ticker devolvió datos; no se escribe el archivo")

    payload = {
        "generado": datetime.now(timezone.utc).isoformat(),
        "secciones": [
            {"titulo": titulo, "items": [{"nombre": n, "datos": datos[t]} for n, t in items]}
            for titulo, items in SECCIONES
        ],
    }
    # Evita cerrar el <script> por accidente si algún texto contuviera "</"
    blob = json.dumps(payload, ensure_ascii=False).replace("</", "<\\/")
    html = PLANTILLA.replace("__DATA__", blob)

    carpeta = os.path.dirname(destino)
    if carpeta:
        os.makedirs(carpeta, exist_ok=True)
    with open(destino, "w", encoding="utf-8") as f:
        f.write(html)

    faltan = [t for t, v in datos.items() if v is None]
    return len(tickers) - len(faltan), len(tickers), faltan


def servir(destino, puerto, lan):
    """Servidor local mínimo: sirve el HTML y regenera al pulsar el botón."""
    import socket
    import threading
    from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer

    candado = threading.Lock()

    class Manejador(BaseHTTPRequestHandler):
        def _enviar(self, codigo, cuerpo, tipo="text/plain; charset=utf-8"):
            self.send_response(codigo)
            self.send_header("Content-Type", tipo)
            self.send_header("Content-Length", str(len(cuerpo)))
            self.send_header("Cache-Control", "no-store")
            self.end_headers()
            self.wfile.write(cuerpo)

        def do_GET(self):
            ruta = self.path.split("?")[0]
            if ruta in ("/", "/index.html"):
                if not os.path.exists(destino):
                    with candado:
                        generar(destino)
                with open(destino, "rb") as f:
                    self._enviar(200, f.read(), "text/html; charset=utf-8")
            elif ruta == "/estado":
                self._enviar(200, b"ok")
            else:
                self._enviar(404, b"no encontrado")

        def do_POST(self):
            if self.path.split("?")[0] != "/actualizar":
                return self._enviar(404, b"no encontrado")
            if not candado.acquire(blocking=False):
                return self._enviar(429, b"ya se esta actualizando")
            try:
                ok, total, faltan = generar(destino)
                print(f"Actualizado: {ok}/{total} tickers" + (f" (sin datos: {', '.join(faltan)})" if faltan else ""))
                self._enviar(200, b"ok")
            except Exception as e:
                print("Error al actualizar:", e, file=sys.stderr)
                self._enviar(500, str(e).encode("utf-8"))
            finally:
                candado.release()

        def log_message(self, *args):
            pass

    host = "0.0.0.0" if lan else "127.0.0.1"
    servidor = ThreadingHTTPServer((host, puerto), Manejador)
    print(f"Terminal en  http://localhost:{puerto}")
    if lan:
        try:
            s = socket.socket(socket.AF_INET, socket.SOCK_DGRAM)
            s.connect(("10.255.255.255", 1))  # no envia nada; solo averigua la IP local
            print(f"Desde el iPhone (misma wifi)  http://{s.getsockname()[0]}:{puerto}")
            s.close()
        except Exception:
            print("Desde el iPhone: usa la IP local de tu Mac y el puerto", puerto)
    print("Ctrl+C para parar.")
    try:
        servidor.serve_forever()
    except KeyboardInterrupt:
        print("\nParado.")


def main():
    import argparse
    carpeta_script = os.path.dirname(os.path.abspath(__file__))
    ap = argparse.ArgumentParser(description="Terminal planetaria (solo lectura)")
    ap.add_argument("destino", nargs="?", default=os.path.join(carpeta_script, "terminal_planetaria.html"))
    ap.add_argument("--serve", action="store_true", help="servir en local con botón Actualizar")
    ap.add_argument("--lan", action="store_true", help="con --serve: accesible desde otros dispositivos de tu wifi")
    ap.add_argument("--puerto", type=int, default=8765)
    a = ap.parse_args()

    if a.serve:
        servir(a.destino, a.puerto, a.lan)
        return

    try:
        ok, total, faltan = generar(a.destino)
    except RuntimeError as e:
        print("ERROR:", e, file=sys.stderr)
        sys.exit(1)
    print(f"OK: {a.destino} ({ok}/{total} tickers)")
    if faltan:
        print("Sin datos:", ", ".join(faltan))


if __name__ == "__main__":
    main()
