name: Actualizar Terminal Planetaria

on:
  workflow_dispatch: # Te permite ejecutarlo manualmente desde la pestaña Actions
  schedule:
    - cron: '0 20 * * 1-5' # Opcional: Se ejecuta automáticamente de lunes a viernes a las 20:00 UTC

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Descargar el repositorio
      uses: actions/checkout@v4

    - name: Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Instalar dependencias
      run: |
        python -m pip install --upgrade pip
        pip install yfinance

    - name: Ejecutar script de Python
      run: |
        python terminal_planetaria.py

    - name: Subir el HTML generado como artefacto
      uses: actions/upload-artifact@v4
      with:
        name: terminal-html
        path: terminal_planetaria.html
